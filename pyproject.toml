[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-ir"
version = "0.1.0"
description = "A Universal Semantic Intermediate Representation for Repository-Scale Code Reasoning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kaushal Balagurusamy & Project Unity Working Group" }
]
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-go>=0.25.0",
    "lark>=1.3.0",
    "z3-solver>=5.1.0",
    "networkx>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]
